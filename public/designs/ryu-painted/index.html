<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryu — Chat</title>
<meta name="description" content="Ryu: a chatbot home screen set in a majestic mountain valley at golden hour, with dragons flying through the light.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3c98b;--glass:rgba(22,14,20,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a1d1f}
body{font:14px/1.4 Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hist{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid rgba(255,230,200,.28);border-radius:10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 12.5px Inter;color:#fbeee0;cursor:pointer}
.center{position:fixed;left:50%;top:47%;transform:translate(-50%,-50%);width:min(660px,92vw);text-align:center}
.halo{position:absolute;left:50%;top:50%;width:170%;height:300%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(28,16,22,.55),rgba(28,16,22,.22) 55%,rgba(28,16,22,0));pointer-events:none}
.kana{position:relative;font:500 12px Inter;letter-spacing:.42em;color:var(--gold);margin-bottom:12px}
h1{position:relative;font:500 clamp(36px,5.2vw,62px)/1.02 'Cormorant Garamond',serif;letter-spacing:-.005em;margin-bottom:26px;color:#fff8ef;text-shadow:0 2px 30px rgba(40,15,10,.55)}
h1 em{color:var(--gold)}
.box{position:relative;text-align:left;padding:14px 14px 10px 18px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,230,200,.26);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);box-shadow:0 24px 60px rgba(20,8,10,.45),inset 0 1px 0 rgba(255,240,220,.18)}
textarea{width:100%;height:46px;border:0;background:none;resize:none;outline:0;font:15px Inter;color:#fff}
textarea::placeholder{color:rgba(255,236,220,.6)}
.row{display:flex;align-items:center;gap:14px;color:rgba(255,236,220,.7)}
.row svg{width:16px;height:16px}
.row .sp{flex:1}
.row small{font:11px ui-monospace,monospace;color:rgba(255,236,220,.45)}
.send{width:32px;height:32px;border-radius:10px;border:0;display:grid;place-items:center;background:linear-gradient(135deg,#f6d29b,#e58a4e);color:#2a1410;box-shadow:0 6px 18px rgba(230,140,80,.4);cursor:pointer}
.chips{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{padding:7px 13px;border-radius:999px;background:rgba(22,14,20,.32);border:1px solid rgba(255,230,200,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;color:#fbeee0}
.chips b{color:var(--gold);font-weight:500;margin-right:6px}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<button class="hist"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8a6 6 0 1 0 2-4.5M2 2v3h3M8 5v3l2 1.5"/></svg>History<span style="opacity:.5">⌄</span></button>
<main class="center">
  <div class="halo"></div>
  <p class="kana">竜 · RYU</p>
  <h1>where shall we <em>fly</em> today?</h1>
  <div class="box">
    <textarea placeholder="Ask Ryu anything…" aria-label="Message"></textarea>
    <div class="row">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2"/></svg>
      <span class="sp"></span><small>↵ send · ⇧↵ newline</small>
      <button class="send" aria-label="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12 12 4M5.5 4H12v6.5"/></svg></button>
    </div>
  </div>
  <div class="chips"><span><b>⛰</b>Plan a trek to the falls</span><span><b>☼</b>Chase the golden hour</span><span><b>✦</b>Dragon lore</span></div>
</main>

<script>
const Q=new URLSearchParams(location.search);
const STILL=Q.has('still')||matchMedia('(prefers-reduced-motion: reduce)').matches;
const STILL_T=+(Q.get('t')||10.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const img=new Image();img.src='assets/valley.png';
let W,H,DPR,fog;
const rnd=(i,j=0)=>{let n=(i*374761393+j*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295};
const SUN=[.535,.31];                                   // sun position in the plate (fraction of the image)

function build(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  // soft fog strip, tiled horizontally
  fog=document.createElement('canvas');fog.width=1600;fog.height=360;const g=fog.getContext('2d');
  for(let i=0;i<140;i++){const x=rnd(i,1)*1600,y=120+rnd(i,2)*140,r=60+rnd(i,3)*150,a=.05+rnd(i,4)*.08;
    for(const dx of[-1600,0,1600]){const gr=g.createRadialGradient(x+dx,y,0,x+dx,y,r);gr.addColorStop(0,`rgba(255,240,228,${a})`);gr.addColorStop(1,'rgba(255,240,228,0)');g.fillStyle=gr;g.fillRect(x+dx-r,y-r,r*2,r*2)}}}

/* camera: cover-fit the plate with a slow drift */
function cam(t){const z=1.06+.025*Math.sin(t*.09),s=Math.max(W/img.width,H/img.height)*z,dw=img.width*s,dh=img.height*s;
  return{s,x:(W-dw)/2+Math.sin(t*.07)*W*.008,y:(H-dh)/2+Math.cos(t*.06)*H*.006}}

/* ---------------- dragons: 4-pose flap cycle from the keyed sprite sheet ---------------- */
const POSES=[0,1,2,3].map(i=>{const m=new Image();m.src=`assets/dragon-${i}.png`;return m});
const AX=300,AY=300;                                    // body anchor inside each 420×560 frame
function tint(d){d.fr=POSES.map(m=>{const c=document.createElement('canvas');c.width=m.width;c.height=m.height;const x=c.getContext('2d');x.drawImage(m,0,0);
  if(d.haze){x.globalCompositeOperation='source-atop';x.fillStyle=`rgba(236,186,150,${d.haze})`;x.fillRect(0,0,c.width,c.height)}return c})}
function dragon(d,t){
  const P=d.P,u=(((t+d.off)%P)+P)%P/P,k=W/1600;
  const x=W*(d.x0+(d.x1-d.x0)*u),y=H*(d.y+d.dy*Math.sin(u*Math.PI*2+d.ph));
  const vy=d.dy*Math.cos(u*Math.PI*2+d.ph)*2*Math.PI*H/P,vx=(d.x1-d.x0)*W/P,dir=Math.sign(vx);
  const ph=t*d.f*4+d.ph*3,i=Math.floor(ph)%4,fr=ph-Math.floor(ph),blend=Math.min(1,Math.max(0,(fr-.6)/.4));
  const bob=Math.sin(ph/4*Math.PI*2+1.2)*7*d.s*k;
  ctx.save();ctx.translate(x,y+bob);ctx.rotate(Math.atan2(vy,Math.abs(vx))*.5*dir);ctx.scale(d.s*k*dir,d.s*k);
  ctx.drawImage(d.fr[i],-AX,-AY);
  if(blend>0){ctx.globalAlpha=blend;ctx.drawImage(d.fr[(i+1)%4],-AX,-AY)}
  ctx.restore();ctx.globalAlpha=1}

const DR=[
  {x0:-.35,x1:1.35,y:.27,dy:.04,ph:0,P:16,off:-1.5,s:1.15,f:.55,haze:0},
  {x0:1.25,x1:-.25,y:.44,dy:.04,ph:1.4,P:22,off:7,s:.55,f:.75,haze:.28},
  {x0:-.15,x1:1.15,y:.31,dy:.03,ph:2.2,P:28,off:16,s:.28,f:.95,haze:.5},
  {x0:1.12,x1:-.12,y:.52,dy:.025,ph:.6,P:25,off:3,s:.2,f:1.1,haze:.6}];

/* ---------------- atmosphere ---------------- */
function rays(t,c){const sx=c.x+img.width*c.s*SUN[0],sy=c.y+img.height*c.s*SUN[1];
  ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(sx,sy);
  for(let i=0;i<14;i++){const a=-Math.PI+Math.PI*(i+.5)/14+Math.sin(t*.15+i)*.03,w=.025+.03*rnd(i,4),al=(.035+.04*rnd(i,5))*(.7+.3*Math.sin(t*.4+i*1.7));
    ctx.rotate(0);const g=ctx.createLinearGradient(0,0,Math.cos(a)*W,Math.sin(a)*W);g.addColorStop(0,`rgba(255,214,160,${al})`);g.addColorStop(1,'rgba(255,214,160,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-w)*W*1.2,Math.sin(a-w)*W*1.2);ctx.lineTo(Math.cos(a+w)*W*1.2,Math.sin(a+w)*W*1.2);ctx.fill()}
  const b=ctx.createRadialGradient(0,0,0,0,0,H*.35);b.addColorStop(0,'rgba(255,236,190,.35)');b.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=b;ctx.fillRect(-H*.4,-H*.4,H*.8,H*.8);
  ctx.restore()}
function mist(t,y,h,speed,alpha){const fw=W*1.4,fh=h,o=((t*speed)%fw+fw)%fw;ctx.globalAlpha=alpha;
  ctx.drawImage(fog,-o,y,fw,fh);ctx.drawImage(fog,fw-o,y,fw,fh);ctx.globalAlpha=1}
function motes(t){ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<70;i++){const x=((rnd(i,1)*W+t*(6+rnd(i,2)*10)+Math.sin(t*.6+i)*14)%W+W)%W,y=((rnd(i,3)*H-t*(5+rnd(i,4)*9))%H+H)%H,a=.25+.5*Math.abs(Math.sin(t*1.1+i*2.3)),r=.7+rnd(i,5)*1.6;
    ctx.fillStyle=`rgba(255,214,150,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.restore()}
function vignette(){const g=ctx.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.5,Math.max(W,H)*.78);g.addColorStop(0,'rgba(20,10,14,0)');g.addColorStop(1,'rgba(20,10,14,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

function frame(t){
  const c=cam(t);ctx.drawImage(img,c.x,c.y,img.width*c.s,img.height*c.s);
  rays(t,c);
  dragon(DR[3],t);dragon(DR[2],t);
  mist(t,H*.5,H*.32,14,.55);
  dragon(DR[1],t);
  mist(t+40,H*.7,H*.4,24,.45);
  dragon(DR[0],t);
  motes(t);vignette();
}
window.__seek=t=>frame(t);

Promise.all([img,...POSES].map(m=>m.decode())).then(()=>{build();DR.forEach(tint);
  if(STILL)frame(STILL_T);
  else{const t0=performance.now()-STILL_T*1000;const loop=now=>{frame((now-t0)/1000);requestAnimationFrame(loop)};requestAnimationFrame(loop);
    let to;addEventListener('resize',()=>{clearTimeout(to);to=setTimeout(build,150)})}
  window.__ready=true});
</script>
</body>
</html>
