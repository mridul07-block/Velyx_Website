<!doctype html>
<html><head><meta charset="utf-8"><title>Aurelle hero loop</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:800px;overflow:hidden;background:#f4f1ea;font-family:Inter,sans-serif;color:#121212;-webkit-font-smoothing:antialiased}
canvas{position:absolute;inset:0;width:1280px;height:800px}
nav{position:absolute;left:112px;right:112px;top:26px;display:flex;align-items:center;justify-content:space-between;font-size:13px;z-index:2}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo i{width:20px;height:20px;border:1.6px solid #121212;border-radius:50%;position:relative}
.logo i:after{content:'';position:absolute;left:6.5px;top:3px;width:4px;height:11px;background:#121212;border-radius:1px 1px 0 0}
.links{display:flex;gap:30px;color:#555}
.btn{border:1.2px solid #121212;border-radius:20px;padding:8px 16px;font-weight:500}
.eb{position:absolute;top:112px;width:100%;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:#666;z-index:2}
.eb b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ea8a4c;margin-right:8px;vertical-align:0}
h1{position:absolute;top:130px;width:100%;text-align:center;font-family:'Instrument Serif',serif;font-weight:400;font-size:62px;letter-spacing:-.02em;z-index:2}
h1 em{color:#3f4fe0}
p{position:absolute;top:212px;left:50%;transform:translateX(-50%);width:440px;text-align:center;font-size:14.5px;line-height:1.55;color:#555;z-index:2}
.cta{position:absolute;top:278px;width:100%;display:flex;justify-content:center;gap:10px;font-size:13.5px;font-weight:500;z-index:2}
.cta span{padding:10px 18px;border-radius:22px;border:1.2px solid #121212}
.cta span:first-child{background:#121212;color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<nav><div class="logo"><i></i>Aurelle</div><div class="links"><span>Residences</span><span>Floor plans</span><span>Amenities</span><span>Location</span></div><div class="btn">Book a viewing</div></nav>
<div class="eb"><b></b>AL FURJAN · DUBAI · 12 AMENITIES</div>
<h1>A new skyline, <em>one floor</em> at a time</h1>
<p>One to four-bedroom residences and penthouses rising over Al Furjan. Walk every floor in 3D before it's built.</p>
<div class="cta"><span>Explore floors &nbsp;→</span><span>Book a viewing</span></div>
<script>
const W=1280,H=800,P=6,TAU=Math.PI*2,DPR=1.5,BASE=748;
const cv=document.getElementById('c');cv.width=W*DPR;cv.height=H*DPR;const g=cv.getContext('2d');
let sd=11;const R=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const INK='#121212',BLUE='#3f4fe0',OR='#ea8a4c',PAPER='#f7f5ef',BG='#f4f1ea';
const fr=x=>x-Math.floor(x),cyc=(t,k=1,ph=0)=>Math.sin(TAU*(k*t/P+ph)),ease=u=>u<.5?4*u*u*u:1-(-2*u+2)**3/2;
const par=(t,a)=>a*Math.sin(TAU*t/P);

// ---------- static scene data ----------
const blueB=[[-30,64,520],[40,46,496],[112,50,468],[182,72,548],[300,48,498],[420,62,528],[566,40,488],[936,62,470],[1056,42,520],[1128,72,478],[1212,70,506],[1278,40,540]];
const needle=[[212,44,560],[218,32,500],[223,22,450],[228,12,408],[231,6,372]];
const blueDots=[];
for(const [x,w,top] of [...blueB,...needle]){let col=0;for(let xx=x+2.5;xx<x+w;xx+=5.2,col++)for(let y=top+2.5;y<BASE;y+=5.2){if(R()<.08)continue;const v=(y-top)/(BASE-top);blueDots.push([xx,y,(col%3==2?.9:1.25)+.8*v+R()*.35])}}
const clouds=[{x:250,y:452,b:[[0,0,70,20],[-40,6,40,14],[38,-6,44,16]],ph:0},{x:560,y:418,b:[[0,0,60,18],[30,8,40,12]],ph:.3},{x:1040,y:430,b:[[0,0,82,22],[-50,8,40,14],[46,-8,40,14]],ph:.6},{x:90,y:600,b:[[0,0,46,14]],ph:.8}];
for(const c of clouds){c.d=[];for(let y=-40;y<=40;y+=6)for(let x=-130;x<=130;x+=6){let d=0;for(const [bx,by,rx,ry] of c.b){const q=((x-bx)/rx)**2+((y-by)/ry)**2;d=Math.max(d,1-q)}if(d>0)c.d.push([x+(y/6%2?3:0),y,Math.min(2.6,.5+d*2.8)])}}
// [x,w,top,white,crown]  crown: 0 antenna, 1 stepped, 2 spire, 3 slant, 4 dome
const blk=[[-20,38,600,0,0],[40,46,562,0,1],[95,38,612,0,3],[150,52,522,1,2],[222,40,642,0,0],[276,58,588,0,1],[352,44,632,1,4],[402,40,566,0,3],[456,50,602,0,0],[520,34,652,0,1],[604,46,612,1,2],[662,40,566,0,0],[908,52,546,0,3],[970,38,622,1,1],[1022,58,520,0,9],[1100,44,602,0,2],[1158,56,562,1,0],[1226,42,632,0,3],[1270,40,590,0,0]];
for(const b of blk){b.win=[];if(!b[3])for(let y=b[2]+6;y<BASE-4;y+=6)for(let x=b[0]+4;x<b[0]+b[1]-4;x+=5)b.win.push([x,y,R()<.78,R()<.05?R():-1,(x-b[0])/b[1]>.66])}
const sparkles=[[60,424,5],[330,402,4],[1170,420,6],[1234,476,4],[478,470,3.5],[1000,370,4]];
function canopy(cx,cy,r){const cs=[[cx,cy,r]];for(let i=0;i<16;i++){const a=R()*TAU,d=r*(.55+R()*.3);cs.push([cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,r*(.28+R()*.25)])}
 const dots=[];for(let i=0;i<r*r*1.3;i++){const x=cx+(R()*2-1)*r*1.3,y=cy+(R()*2-1)*r*1.1;if(!cs.some(([a,b,c])=>(x-a)**2+(y-b)**2<c*c*.82))continue;const l=Math.max(0,((cx-x)+(cy-y))/r);if(R()<.14+.5*l)dots.push([x,y,.4+R()*.65])}return{cs,dots,ph:R()}}
const trees=[[-6,22],[28,24],[122,30],[205,22],[330,28],[432,24],[560,30],[652,22],[930,28],[1050,32],[1182,26],[1286,24]].map(([x,r])=>canopy(x,BASE-r*.9,r));
const palms=[[262,96,.1],[490,84,-.08],[738,108,.06],[996,92,-.1],[1122,102,.08],[1250,88,-.05]].map(([x,h,lean])=>({x,h,lean,ph:R()}));
const halo=[];for(let y=598-250;y<598+250;y+=6.5)for(let x=700-250;x<700+250;x+=6.5){const d=Math.hypot(x-700,y-598);if(d>138&&d<250){const k=1-(d-138)/112;halo.push([x+((y/6.5|0)%2?3.25:0),y,[.4+1.9*k*k,.25+.5*k]])}}
const lamps=[80,190,380,610,900,1080,1210];
const waves=[];for(let y=757;y<800;y+=4.5)for(let x=0;x<160;x+=0){const l=6+R()*18;waves.push([x,y,l]);x+=l+6+R()*14}

// elevator stops: [time, level]
const STOPS=[[0,4],[.7,18],[1.5,18],[2.2,34],[3.0,34],[3.7,52],[4.6,52],[6,4]];
function levelAt(t){for(let i=1;i<STOPS.length;i++){const [t0,l0]=STOPS[i-1],[t1,l1]=STOPS[i];if(t<=t1)return l0+(l1-l0)*ease((t-t0)/(t1-t0))}return 4}
const FL=4.6,TB=BASE-4; // floor height, tower ground floor y
const unit=l=>{l=Math.round(l);return l>=50?['PENTHOUSE','AVAILABLE']:[(1+l%4)+' BR',l%5==3?'SOLD':'AVAILABLE']};

// ---------- helpers ----------
const dot=(x,y,r)=>{g.moveTo(x+r,y);g.arc(x,y,r,0,TAU)};
function star(x,y,s,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x,y,x+s,y);g.quadraticCurveTo(x,y,x,y+s);g.quadraticCurveTo(x,y,x-s,y);g.quadraticCurveTo(x,y,x,y-s);g.fill()}
function hatch(x0,y0,x1,y1,sp,lw,a){g.save();g.beginPath();g.rect(x0,y0,x1-x0,y1-y0);g.clip();g.strokeStyle=INK;g.globalAlpha=a;g.lineWidth=lw;g.beginPath();for(let k=x0-(y1-y0);k<x1;k+=sp){g.moveTo(k,y1);g.lineTo(k+(y1-y0),y0)}g.stroke();g.restore()}
function lattice(x0,y0,x1,y1,x2,y2,x3,y3,n){g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.moveTo(x2,y2);g.lineTo(x3,y3);for(let i=0;i<=n;i++){const u=i/n,v=Math.min(1,(i+1)/n);g.moveTo(x0+(x1-x0)*u,y0+(y1-y0)*u);g.lineTo(x2+(x3-x2)*v,y2+(y3-y2)*v);g.lineTo(x0+(x1-x0)*v,y0+(y1-y0)*v)}g.stroke()}
function rrect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function crown(x,w,top,type){g.fillStyle=INK;g.strokeStyle=INK;g.lineWidth=1;
 if(type==0){g.beginPath();g.moveTo(x+w*.3,top);g.lineTo(x+w*.3,top-14-w*.2);if(w>40){g.moveTo(x+w*.7,top);g.lineTo(x+w*.7,top-22)}g.stroke()}
 if(type==1){g.fillRect(x+w*.15,top-9,w*.7,9);g.fillRect(x+w*.3,top-16,w*.4,7)}
 if(type==2){g.beginPath();g.moveTo(x+w*.2,top);g.lineTo(x+w*.5,top-34);g.lineTo(x+w*.8,top);g.fill();g.beginPath();g.moveTo(x+w*.5,top-34);g.lineTo(x+w*.5,top-50);g.stroke()}
 if(type==3){g.beginPath();g.moveTo(x,top);g.lineTo(x+w,top-16);g.lineTo(x+w,top);g.fill()}
 if(type==4){g.beginPath();g.arc(x+w/2,top,w*.42,Math.PI,0);g.fill();g.beginPath();g.moveTo(x+w/2,top-w*.42);g.lineTo(x+w/2,top-w*.42-12);g.stroke()}}

function building(b,t){const [x,w,top,white,cr]=b;
 if(white){g.fillStyle=PAPER;g.fillRect(x,top,w,BASE-top);hatch(x+w*.55,top,x+w,BASE,2.4,.7,.9);g.strokeStyle=INK;g.lineWidth=1.3;g.strokeRect(x,top,w,BASE-top);
  g.lineWidth=.55;g.beginPath();for(let y=top+6;y<BASE;y+=6){g.moveTo(x,y);g.lineTo(x+w,y)}for(let xx=x+6;xx<x+w;xx+=6){g.moveTo(xx,top);g.lineTo(xx,BASE)}g.stroke();
  g.lineWidth=1.6;g.beginPath();for(let y=top+24;y<BASE;y+=24){g.moveTo(x-1,y);g.lineTo(x+w+1,y)}g.stroke();
  g.fillStyle=INK;g.fillRect(x-2,top-2,w+4,3);if(cr!=9)crown(x,w,top-2,cr);return}
 g.fillStyle=INK;g.fillRect(x,top,w,BASE-top);
 for(const [wx,wy,on,tw,sh] of b.win){let lit=on;if(tw>=0)lit=cyc(t,1+Math.floor(tw*3),tw)>-.2;if(!lit)continue;g.fillStyle=tw>=0?'#f2c08f':(sh?'#8c8a85':'#ebe8e1');g.fillRect(wx,wy,2.6,3.2)}
 if(cr!=9)crown(x,w,top,cr)}

// hero tower: sections [y0,y1,inset]
const SEC=[[TB,606,0],[606,512,7],[512,436,14]],TL=764,TR=896,CTOP=384;
function tower(t){
 const lvl=levelAt(t),fy=TB-lvl*FL;
 for(const [y0,y1,ins] of SEC){const x0=TL+ins,x1=TR-ins,w=x1-x0;
  g.fillStyle=PAPER;g.fillRect(x0,y1,w,y0-y1);
  hatch(x0+w*.64,y1,x1,y0,2.2,.75,.95);
  g.strokeStyle=INK;g.lineWidth=.5;g.globalAlpha=.85;g.beginPath();for(let y=y0-FL;y>y1;y-=FL){g.moveTo(x0,y);g.lineTo(x1,y)}for(let x=x0+8;x<x1;x+=8){g.moveTo(x,y1);g.lineTo(x,y0)}g.stroke();g.globalAlpha=1;
  g.lineWidth=1.8;g.beginPath();g.moveTo(x0+w*.33,y1);g.lineTo(x0+w*.33,y0);g.moveTo(x0+w*.64,y1);g.lineTo(x0+w*.64,y0);g.stroke();
  g.fillStyle=INK;for(let y=y0-FL*3;y>y1+2;y-=FL*4){g.fillRect(x0,y,w*.33,1.5)}
  g.lineWidth=1.5;g.strokeRect(x0,y1,w,y0-y1);g.fillRect(x0-2,y1-2,w+4,3)}
 // lit floors trail below the elevator
 g.fillStyle=OR;for(let l=2;l<lvl-1;l+=1){const y=TB-l*FL,ins=y<512?14:y<606?7:0;if((l*7)%5<2){g.globalAlpha=.75;g.fillRect(TL+ins+3+(l*13)%40,y-FL+1,7,FL-2)}}g.globalAlpha=1;
 // floor highlight
 const ins=fy<512?14:fy<606?7:0;g.fillStyle=BLUE;g.globalAlpha=.85;g.fillRect(TL+ins,fy-FL,TR-TL-2*ins,FL);g.globalAlpha=.25;g.fillRect(TL+ins-6,fy-FL-3,TR-TL-2*ins+12,FL+6);g.globalAlpha=1;
 // construction floors
 const x0=TL+14,x1=TR-14;g.strokeStyle=INK;g.lineWidth=.8;g.beginPath();for(let x=x0+2;x<=x1-2;x+=13){g.moveTo(x,436);g.lineTo(x,CTOP+6)}g.stroke();
 g.lineWidth=1.8;g.beginPath();for(let y=436-10;y>=CTOP;y-=10.4){g.moveTo(x0,y);g.lineTo(x1,y)}g.stroke();
 g.fillStyle=PAPER;g.lineWidth=.6;for(let i=0;i<5;i++){g.fillRect(x0+2+i*13,427,12,8);g.strokeRect(x0+2+i*13,427,12,8)}for(let i=0;i<2;i++){g.fillRect(x0+2+i*13,417,12,8);g.strokeRect(x0+2+i*13,417,12,8)}
 // hoist rail + car
 const rx=TR+4;g.lineWidth=.8;g.beginPath();g.moveTo(rx,BASE);g.lineTo(rx,CTOP+2);g.moveTo(rx+5,BASE);g.lineTo(rx+5,CTOP+2);for(let y=BASE;y>CTOP;y-=8){g.moveTo(rx,y);g.lineTo(rx+5,y-8)}g.stroke();
 g.fillStyle=PAPER;g.lineWidth=1.2;g.fillRect(rx-3,fy-14,12,14);g.strokeRect(rx-3,fy-14,12,14);g.fillStyle=BLUE;g.fillRect(rx-.5,fy-11,7,5);g.fillStyle=OR;g.fillRect(rx+1.5,fy-16.4,3,2.4);
 return {lvl,fy}}

function tag(t,lvl,fy){const L=Math.round(lvl),[u,st]=unit(L),moving=Math.abs(levelAt(t+.05)-lvl)>.05;
 const x=618,y=fy-20,w=130,h=34;g.strokeStyle=INK;g.lineWidth=.8;g.setLineDash([2,2]);g.beginPath();g.moveTo(x+w,y+h/2);g.lineTo(TL-4,fy-FL/2);g.stroke();g.setLineDash([]);
 g.fillStyle=INK;g.beginPath();dot(TL-4,fy-FL/2,2);g.fill();
 rrect(x,y,w,h,6);g.fillStyle=PAPER;g.fill();g.lineWidth=1.2;g.stroke();
 g.fillStyle=INK;g.font='600 10px "JetBrains Mono"';g.fillText('LEVEL '+String(L).padStart(2,'0'),x+9,y+14);
 g.font='500 8px "JetBrains Mono"';g.fillStyle=moving?'#888':(st=='SOLD'?'#c0392b':'#2f7d32');g.fillText(moving?'· · ·':u+' · '+st,x+9,y+26);
 g.fillStyle=moving?OR:(st=='SOLD'?'#c0392b':'#3fae49');g.beginPath();dot(x+w-10,y+11,2.4);g.fill()}

function crane(t,o){const {mx,base,jy,top,Lj0,Lc0,dir,ph,hk}=o;const phi=.8*cyc(t,1,ph),k=Math.cos(phi);
 g.strokeStyle=INK;g.lineWidth=.8;lattice(mx-3,base,mx-3,jy,mx+3,base,mx+3,jy,Math.round((base-jy)/6));
 g.lineWidth=1.3;g.beginPath();g.moveTo(mx-3,base);g.lineTo(mx-3,jy);g.moveTo(mx+3,base);g.lineTo(mx+3,jy);g.stroke();
 const Lj=Lj0*k*dir,Lc=Lc0*k*dir;
 g.lineWidth=1.1;g.beginPath();g.moveTo(mx-3,jy);g.lineTo(mx,top);g.lineTo(mx+3,jy);g.moveTo(mx,top);g.lineTo(mx+Lj,jy+1);g.moveTo(mx,top);g.lineTo(mx-Lc,jy+1);g.stroke();
 g.lineWidth=.7;lattice(mx,jy-3,mx+Lj,jy-1,mx,jy+3,mx+Lj,jy+2,Math.max(6,Math.round(Math.abs(Lj)/7)));
 g.lineWidth=1.3;g.beginPath();g.moveTo(mx,jy+3);g.lineTo(mx+Lj,jy+2);g.moveTo(mx,jy+3);g.lineTo(mx-Lc,jy+3);g.stroke();
 g.fillStyle=INK;g.fillRect(mx-Lc-(dir>0?0:14*k),jy+3,14*k,9);g.fillRect(mx-dir*11-(dir>0?0:-2),jy-1,9,8);
 const tx=mx+Lj*(.62+.12*cyc(t,1,ph+.25)),hook=hk[0]+hk[1]*(.5-.5*Math.cos(TAU*t/P+ph*6)),sw=.06*cyc(t,2,ph);
 g.fillRect(tx-3,jy+2,6,3);const hx=tx+Math.sin(sw)*hook,hy=jy+5+Math.cos(sw)*hook;
 g.lineWidth=.6;g.beginPath();g.moveTo(tx-1,jy+5);g.lineTo(hx-1,hy);g.moveTo(tx+1,jy+5);g.lineTo(hx+1,hy);g.stroke();
 g.save();g.translate(hx,hy);g.rotate(sw*1.6);g.beginPath();g.moveTo(0,0);g.lineTo(-10,8);g.moveTo(0,0);g.lineTo(10,8);g.stroke();
 g.fillStyle=PAPER;g.fillRect(-13,8,26,13);g.fillStyle=BLUE;g.globalAlpha=.55;g.fillRect(-11,10,22,9);g.globalAlpha=1;g.lineWidth=1.1;g.strokeRect(-13,8,26,13);g.beginPath();g.moveTo(0,8);g.lineTo(0,21);g.stroke();g.restore();
 if(cyc(t,3,ph)>.3)star(mx,top-3,4,OR)}

function sparks(t){for(const [sx,sy,ph] of [[798,424,0],[864,404,.37],[1040,516,.7]]){const f=Math.max(0,cyc(t,3,ph))**3;
 if(f>.05){g.globalAlpha=f;star(sx,sy,3+6*f,'#ffb36b');star(sx,sy,1.6+2.4*f,'#fff7e8')}
 for(let i=0;i<8;i++){const u=fr(t*3/P+i/8+ph);const vx=(i%2?1:-1)*(4+i*2.2);g.globalAlpha=(1-u)*.95;g.fillStyle=i%3?OR:'#ffb36b';g.beginPath();dot(sx+vx*u,sy+u*u*32,1.1);g.fill()}g.globalAlpha=1}}

function palm(p,t){const {x,h,lean}=p,sway=.06*cyc(t,1,p.ph),tx=x+lean*h+sway*h*.6,ty=BASE-h;
 g.strokeStyle=INK;g.lineCap='round';for(let i=0;i<14;i++){const u=i/14,v=(i+1)/14;g.lineWidth=5-u*2;g.beginPath();g.moveTo(x+(tx-x)*u*u,BASE-h*u);g.lineTo(x+(tx-x)*v*v,BASE-h*v);g.stroke()}
 g.strokeStyle=PAPER;g.lineWidth=.6;g.beginPath();for(let i=1;i<14;i++){const u=i/14,px=x+(tx-x)*u*u,py=BASE-h*u;g.moveTo(px-2,py);g.lineTo(px+2,py+.6)}g.stroke();
 for(let i=0;i<11;i++){const a=-Math.PI*(.02+i/10*.96)+sway*(1.5+i%3*.4),len=40+(i%3)*9,droop=16+(i%2)*8;
  const ex=tx+Math.cos(a)*len,ey=ty+Math.sin(a)*len*.5+droop,cx=tx+Math.cos(a)*len*.55,cy=ty+Math.sin(a)*len*.75-7;
  const nx=-Math.sin(a)*6,ny=Math.cos(a)*6;g.fillStyle=INK;g.beginPath();g.moveTo(tx,ty);g.quadraticCurveTo(cx+nx,cy+ny,ex,ey);g.quadraticCurveTo(cx-nx,cy-ny,tx,ty);g.fill();
  g.strokeStyle=PAPER;g.lineWidth=.45;g.beginPath();g.moveTo(tx,ty);g.quadraticCurveTo(cx,cy,ex,ey);for(let j=1;j<6;j++){const u=j/6,px=(1-u)*(1-u)*tx+2*u*(1-u)*cx+u*u*ex,py=(1-u)*(1-u)*ty+2*u*(1-u)*cy+u*u*ey;g.moveTo(px,py);g.lineTo(px+nx*.5,py+ny*.5)}g.stroke()}
 g.fillStyle=INK;g.beginPath();dot(tx,ty,4.5);g.fill()}

function tree(tr,t){const s=1.2*cyc(t,1,tr.ph);g.fillStyle=INK;g.beginPath();for(const [x,y,r] of tr.cs)dot(x+s*(BASE-y)/40,y,r);g.fill();g.fillStyle='#e9e6de';g.beginPath();for(const [x,y,r] of tr.dots)dot(x+s*(BASE-y)/40,y,r);g.fill()}
